name: Build Obsidian Midi APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      publish_github_release:
        description: "GitHub Releases にも生APKを公開する（スマホから直接 .apk をDLしたい場合に便利）"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Test Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK & Accept Licenses
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK Platform (36.1) & Build Tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare .env and debug.keystore
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              tr -d '\n\r ' < debug.keystore.base64 | base64 -d > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Assemble Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare Release Signing Key & Assemble Release APK
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="/tmp/ci-upload-key.jks"
          if [ -n "$SECRET_KEYSTORE_B64" ] && [ -n "$SECRET_STORE_PASS" ] && [ -n "$SECRET_KEY_PASS" ]; then
            echo "$SECRET_KEYSTORE_B64" | tr -d '\n\r ' | base64 -d > "$KEYSTORE_FILE"
            export KEYSTORE_PATH="$KEYSTORE_FILE"
            export STORE_PASSWORD="$SECRET_STORE_PASS"
            export KEY_PASSWORD="$SECRET_KEY_PASS"
          else
            # Secrets未設定でも即インストール可能な署名付きRelease APKを生成
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storepass "obsidian_ci_store" \
              -alias "upload" \
              -keypass "obsidian_ci_key" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Obsidian Midi CI,O=Obsidian,C=JP"
            export KEYSTORE_PATH="$KEYSTORE_FILE"
            export STORE_PASSWORD="obsidian_ci_store"
            export KEY_PASSWORD="obsidian_ci_key"
          fi
          gradle :app:assembleRelease --no-daemon

      - name: Collect Named APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ObsidianMidi-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/ObsidianMidi-release.apk
          ls -lh dist/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ObsidianMidi-debug-apk
          path: dist/ObsidianMidi-debug.apk
          if-no-files-found: error

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ObsidianMidi-release-apk
          path: dist/ObsidianMidi-release.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases (Tag push or Manual Dispatch)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_github_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('ci-build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Obsidian Midi Build #{0}', github.run_number) }}
          body: |
            Obsidian Midi 自動ビルド APK です。
            スマートフォンからは以下の `ObsidianMidi-release.apk`（または `ObsidianMidi-debug.apk`）をタップすると解凍不要でそのままダウンロード・インストールできます。
          files: |
            dist/ObsidianMidi-release.apk
            dist/ObsidianMidi-debug.apk
