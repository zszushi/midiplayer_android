name: Build Obsidian Midi APK

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "GitHub Releases にも生APKを公開する"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Configure Android SDK (API 36.1 & Build-Tools 36.0.0)
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER=""
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            FOUND_BIN="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
            if [ -n "$FOUND_BIN" ]; then
              chmod +x "$FOUND_BIN"
              SDKMANAGER="$FOUND_BIN"
            fi
          fi

          if [ -z "$SDKMANAGER" ]; then
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
            mkdir -p "$SDK_ROOT/cmdline-tools"
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools_extract
            mv /tmp/cmdtools_extract/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          validate-wrappers: false

      - name: Prepare .env and Signing Keystores
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              tr -d '\n\r ' < debug.keystore.base64 | base64 -d > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          RELEASE_KS="${RUNNER_TEMP}/ci-upload-key.jks"
          if [ -n "$SECRET_KEYSTORE_B64" ] && [ -n "$SECRET_STORE_PASS" ] && [ -n "$SECRET_KEY_PASS" ]; then
            VALIDATION_KS="${RUNNER_TEMP}/validated-upload-key.p12"
            if printf '%s' "$SECRET_KEYSTORE_B64" | tr -d '\n\r ' | base64 -d > "$RELEASE_KS" \
              && keytool -importkeystore -noprompt \
                -srckeystore "$RELEASE_KS" -srcstoretype JKS \
                -srcstorepass "$SECRET_STORE_PASS" -srcalias upload -srckeypass "$SECRET_KEY_PASS" \
                -destkeystore "$VALIDATION_KS" -deststoretype PKCS12 \
                -deststorepass validation-only >/dev/null 2>&1; then
              rm -f "$VALIDATION_KS"
              echo "Using the configured release keystore."
              echo "KEYSTORE_PATH=$RELEASE_KS" >> "$GITHUB_ENV"
              echo "STORE_PASSWORD=$SECRET_STORE_PASS" >> "$GITHUB_ENV"
              echo "KEY_PASSWORD=$SECRET_KEY_PASS" >> "$GITHUB_ENV"
            else
              echo "Configured release keystore or key password is invalid; generating a temporary CI keystore."
              rm -f "$RELEASE_KS" "$VALIDATION_KS"
            fi
          fi

          if [ ! -f "$RELEASE_KS" ]; then
            keytool -genkeypair -v \
              -keystore "$RELEASE_KS" \
              -storepass "obsidian_ci_store" \
              -alias "upload" \
              -keypass "obsidian_ci_key" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Obsidian Midi CI,O=Obsidian,C=JP"
            echo "KEYSTORE_PATH=$RELEASE_KS" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=obsidian_ci_store" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=obsidian_ci_key" >> "$GITHUB_ENV"
          fi

      - name: Assemble Debug & Release APKs
        run: |
          gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ObsidianMidi-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/ObsidianMidi-release.apk
          ls -lh dist/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ObsidianMidi-debug-apk
          path: dist/ObsidianMidi-debug.apk
          if-no-files-found: error

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ObsidianMidi-release-apk
          path: dist/ObsidianMidi-release.apk
          if-no-files-found: error

      - name: Publish Raw APKs to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release != 'false')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            TAG="$REF_NAME"
            TITLE="Obsidian Midi $REF_NAME"
          else
            TAG="ci-build-${RUN_NUM}"
            TITLE="Obsidian Midi Build #${RUN_NUM}"
          fi
          gh release create "$TAG" \
            dist/ObsidianMidi-release.apk \
            dist/ObsidianMidi-debug.apk \
            --title "$TITLE" \
            --notes "スマートフォンからは下の Assets にある ObsidianMidi-release.apk をタップするとそのままダウンロード・インストールできます。"
